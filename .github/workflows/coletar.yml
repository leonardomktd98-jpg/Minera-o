name: Coletar contagem de anúncios

on:
  schedule:
    - cron: '0 10 * * *'   # 07:00 no horário de Brasília, todo dia
  workflow_dispatch:        # botão "Run workflow" para rodar na hora

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependências
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Ler a biblioteca de anúncios
        run: npm run coletar
      - name: Salvar histórico no repositório
        run: |
          git config user.name  "filao-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/historico.json
          git diff --staged --quiet || git commit -m "Coleta de $(date +'%d/%m/%Y')"
          git push
